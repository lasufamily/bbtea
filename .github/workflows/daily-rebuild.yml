name: Daily Rebuild

on:
  # Runs at 02:00 UTC = 10:00 SGT every day
  schedule:
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  rebuild:
    name: Trigger Cloudflare Pages Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_HOOK_URL }}" ]; then
            echo "❌ CF_DEPLOY_HOOK_URL secret is not set. Add it in GitHub repo Settings → Secrets."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Deploy hook failed with status $STATUS"
            exit 1
          fi
          echo "✅ Deploy triggered successfully"
